<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Ubuntu', sans-serif;
      background: #f4f7fc;
      color: #1e2a3a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      background: #ffffff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
      border-top: 6px solid #004DA4;
      transition: transform 0.2s;
    }
    .container:hover {
      transform: translateY(-4px);
    }
    .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 0.2rem;
    }
    h1 {
      font-size: 6rem;
      font-weight: 700;
      color: #272B7D;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    h2 {
      font-size: 1.8rem;
      font-weight: 400;
      color: #1e2a3a;
      margin-bottom: 1rem;
    }
    p {
      color: #3a4a5e;
      font-size: 1.1rem;
      margin-bottom: 2.2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: #004DA4;
      color: #fff;
      padding: 0.8rem 2.8rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s;
      box-shadow: 0 4px 14px rgba(0, 77, 164, 0.25);
    }
    .btn:hover {
      background: #272B7D;
      transform: translateY(-2px);
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #8a9aa8;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="emoji">🤔</span>

    <a href="/davd-novo/" class="btn">Voltar ao início</a>
