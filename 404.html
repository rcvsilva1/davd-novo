<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Security-Policy"        content="default-src 'self';                 script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;                 img-src 'self' data:;                 font-src 'self' https://fonts.gstatic.com;">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>DAVD/UFS – Página não encontrada</title>
  <meta name="description" content="Página não encontrada no site do DAVD – Departamento de Artes Visuais e Design da UFS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      max-width: 620px;
      width: 100%;
      box-shadow: var(--card-shadow);
      border-top: 6px solid var(--azul-medio);
      transition: transform 0.2s, background 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .container:hover {
      transform: translateY(-4px);
    }
    .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 0.2rem;
    }
    h1 {
      font-size: 6rem;
      font-weight: 700;
      color: var(--azul-escuro);
      line-height: 1;
      margin-bottom: 0.25rem;
      transition: color 0.3s;
    }
    h2 {
      font-size: 1.8rem;
      font-weight: 400;
      color: #1e2a3a;
      margin-bottom: 1rem;
      transition: color 0.3s;
    }
    p {
      color: #3a4a5e;
      font-size: 1.1rem;
      margin-bottom: 2.2rem;
      line-height: 1.6;
      transition: color 0.3s;
    }
    .btn {
      display: inline-block;
      background: var(--azul-medio);
      color: #fff;
      padding: 0.8rem 2.8rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s;
      box-shadow: 0 4px 14px rgba(0, 77, 164, 0.25);
    }
    .btn:hover {
      background: var(--azul-escuro);
      transform: translateY(-2px);
    }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #8a9aa8;
      transition: color 0.3s;
    }
    [data-theme="dark"] .container {
      background: #1a1a2e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border-top-color: #4a8ac0;
    }
    [data-theme="dark"] h1 { color: #8ab7ff; }
    [data-theme="dark"] h2 { color: #d0d0e0; }
    [data-theme="dark"] p { color: #b0b0c0; }
    [data-theme="dark"] .footer-note { color: #8a9aa8; }
    [data-theme="dark"] .btn { background: #3a6a9a; }
    [data-theme="dark"] .btn:hover { background: #2a4a7a; }
    @media (max-width: 480px) {
      .container { padding: 2rem 1.5rem; }
      h1 { font-size: 4rem; }
      h2 { font-size: 1.4rem; }
      .emoji { font-size: 3rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="emoji">🤔</span>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>Ops! Parece que o link que você tentou acessar não existe ou foi movido.</p>
    <a href="/davd-novo/" class="btn">Voltar ao início</a>
    <div class="footer-note">Departamento de Artes Visuais e Design – UFS</div>
  </div>

  <!-- Botão flutuante de tema -->
  <button id="theme-toggle" aria-label="Alternar tema">🌙</button>

  <!-- Usa script.js ao invés de duplicar inline -->
  <script src="script.js"></script>

</body>
</html>
