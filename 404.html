<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAVD/UFS – Página não encontrada</title>
  <meta name="description" content="Página não encontrada no site do DAVD – Departamento de Artes Visuais e Design da UFS." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== RESET E VARIÁVEIS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --azul-escuro: #272B7D;
      --azul-medio: #004DA4;
      --cinza-fundo: #f4f7fc;
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.07);
      --radius: 24px;
    }

    body {
      font-family: 'Ubuntu', sans-serif;
      background: var(--cinza-fundo);
      color: #1e2a3a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      max-width: 620px;
      width: 100%;
      box-shadow: var(--card-shadow);
      border-top: 6px solid var(--azul-medio);
      transition: transform 0.2s, background 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .container:hover {
      transform: translateY(-4px);
    }

    .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 0.2rem;
    }

    h1 {
      font-size: 6rem;
      font-weight: 700;
      color: var(--azul-escuro);
      line-height: 1;
      margin-bottom: 0.25rem;
      transition: color 0.3s;
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 400;
      color: #1e2a3a;
      margin-bottom: 1rem;
      transition: color 0.3s;
    }

    p {
      color: #3a4a5e;
      font-size: 1.1rem;
      margin-bottom: 2.2rem;
      line-height: 1.6;
      transition: color 0.3s;
    }

    .btn {
      display: inline-block;
      background: var(--azul-medio);
      color: #fff;
      padding: 0.8rem 2.8rem;
      border-radius: 50px;
      font-weight: 500;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s;
      box-shadow: 0 4px 14px rgba(0, 77, 164, 0.25);
    }
    .btn:hover {
      background: var(--azul-escuro);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #8a9aa8;
      transition: color 0.3s;
    }

    /* ===== BOTÃO DE TEMA FLUTUANTE ===== */
    #theme-toggle {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--azul-medio);
      color: #fff;
      font-size: 2.2rem;
      border: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #theme-toggle:hover {
      transform: scale(1.08);
      background: var(--azul-escuro);
    }

    /* ===== TEMA ESCURO ===== */
    [data-theme="dark"] body {
      background: #0d0d1a;
      color: #e0e0e0;
    }

    [data-theme="dark"] .container {
      background: #1a1a2e;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border-top-color: #4a8ac0;
    }

    [data-theme="dark"] h1 {
      color: #8ab7ff;
    }

    [data-theme="dark"] h2 {
      color: #d0d0e0;
    }

    [data-theme="dark"] p {
      color: #b0b0c0;
    }

    [data-theme="dark"] .footer-note {
      color: #8a9aa8;
    }

    [data-theme="dark"] .btn {
      background: #3a6a9a;
    }
    [data-theme="dark"] .btn:hover {
      background: #2a4a7a;
    }

    [data-theme="dark"] #theme-toggle {
      background: #f39c12;
      color: #1e2a3a;
    }
    [data-theme="dark"] #theme-toggle:hover {
      background: #e67e22;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 4rem;
      }
      h2 {
        font-size: 1.4rem;
      }
      .emoji {
        font-size: 3rem;
      }
      #theme-toggle {
        width: 56px;
        height: 56px;
        font-size: 1.8rem;
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <span class="emoji">🤔</span>
    <h1>404</h1>
    <h2>Página não encontrada</h2>
    <p>Ops! Parece que o link que você tentou acessar não existe ou foi movido.</p>
    <a href="/davd-novo/" class="btn">Voltar ao início</a>
    <div class="footer-note">Departamento de Artes Visuais e Design – UFS</div>
  </div>

  <!-- Botão flutuante de tema -->
  <button id="theme-toggle" aria-label="Alternar tema">🌙</button>

  <script>
    // ============================================================
    // SCRIPT DE TEMA (mesma lógica do site principal)
    // ============================================================
    (function() {
      const toggleBtn = document.getElementById('theme-toggle');
      if (!toggleBtn) return;

      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        toggleBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
      }

      // Carrega preferência salva ou do sistema
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        setTheme(savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        setTheme('dark');
      }

      // Evento de clique
      toggleBtn.addEventListener('click', function() {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
      });

      // Escuta mudanças no sistema (opcional)
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          setTheme(e.matches ? 'dark' : 'light');
        }
      });
    })();
  </script>

</body>
</html>
